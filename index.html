<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel Search</title>
    <script src="/static/htmx-1.19.12.min.js"></script>
    <script src="/static/tw-3.4.16.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div class="max-w-4xl mx-auto p-4">
        <h1 class="text-3xl font-bold text-center mb-6">Channel Search</h1>

        <div id="search" class="mb-6">
            <h2 class="text-xl font-semibold mb-2">Search</h2>
            <input 
                hx-get="/search" 
                hx-target="#results" 
                hx-trigger="keyup changed" 
                name="q" 
                placeholder="Search channels"
                class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
            >
        </div>

        <div id="results" 
             class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 p-4 bg-white shadow rounded"
             hx-get="/list"
             hx-trigger="load">
        </div>
    </div>
</body>
